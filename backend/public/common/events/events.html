<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Events | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">

<div class="layout">
  <aside class="sidebar">
    <div class="logo-icon">CC</div>
    <a href="javascript:history.back()">← Back</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">
    <section class="greeting">
      <h1>🎉 Campus Events</h1>
      <p>Browse and register for upcoming events</p>
    </section>

    <!-- FILTER -->
    <section class="card" style="width:100%; flex:none; padding:20px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <select id="categoryFilter" onchange="filterEvents()" style="padding:10px 14px; border-radius:10px; border:1px solid var(--border);">
          <option value="">All Categories</option>
          <option value="Academic">🎓 Academic</option>
          <option value="Cultural">🎉 Cultural</option>
          <option value="Sports">⚽ Sports</option>
          <option value="Technical">💻 Technical</option>
        </select>
        <span id="eventCountBadge" style="color:var(--muted); font-size:14px;"></span>
      </div>
    </section>

    <section id="eventsContainer" class="snapshot" style="flex-wrap:wrap;"></section>

    <!-- MY REGISTERED -->
    <section class="card" style="width:100%; flex:none; margin-top:10px;">
      <h2>📋 My Registered Events</h2>
      <ul id="myEventsList" style="list-style:none; padding:0; margin-top:12px;"></ul>
    </section>
  </main>
</div>

<script src="/common/events/events.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    loadWithFilter();
    Events.loadMyEvents("myEventsList");
  });

  function filterEvents() {
    loadWithFilter();
  }

  function loadWithFilter() {
    const cat = document.getElementById("categoryFilter").value;
    Events.loadEvents("eventsContainer", { category: cat, showRegister: true });
  }
</script>
</body>
</html>
