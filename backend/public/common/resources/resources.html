<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resources | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">
  <aside class="sidebar">
    <div class="logo-icon">CC</div>
    <a href="javascript:history.back()">← Back</a>
    <a href="/logout">🚪 Logout</a>
  </aside>
  <main class="dashboard">
    <section class="greeting">
      <h1>📚 Study Resources</h1>
      <p>Find and download study material</p>
    </section>

    <!-- SEARCH & FILTER BAR -->
    <section class="card" style="width:100%; flex:none; padding:20px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <input id="searchInput" placeholder="🔍 Search resources..."
          oninput="doSearch()"
          style="padding:10px 14px; border-radius:10px; border:1px solid var(--border);
            flex:1; min-width:180px;">
        <select id="semFilter" onchange="doSearch()"
          style="padding:10px 14px; border-radius:10px; border:1px solid var(--border);">
          <option value="">All Semesters</option>
          <option value="1">Sem 1</option>
          <option value="2">Sem 2</option>
          <option value="3">Sem 3</option>
          <option value="4">Sem 4</option>
          <option value="5">Sem 5</option>
          <option value="6">Sem 6</option>
          <option value="7">Sem 7</option>
          <option value="8">Sem 8</option>
        </select>
        <select id="typeFilter" onchange="doSearch()"
          style="padding:10px 14px; border-radius:10px; border:1px solid var(--border);">
          <option value="">All Types</option>
          <option value="Notes">Notes</option>
          <option value="PPT">PPT</option>
          <option value="PDF">PDF</option>
          <option value="Assignment">Assignment</option>
        </select>
      </div>
    </section>

    <!-- RESOURCES GRID -->
    <section id="resourcesContainer" class="snapshot" style="flex-wrap:wrap;">
      <p style="color:var(--muted);">Loading resources...</p>
    </section>

    <!-- SAVED RESOURCES -->
    <section class="card" style="width:100%; flex:none;">
      <h2>🔖 Saved Resources</h2>
      <div id="savedContainer"
        style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">
        <p style="color:var(--muted);">Loading saved...</p>
      </div>
    </section>
  </main>
</div>

<script src="/common/resources/resources.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  doSearch();
  Resources.loadSaved("savedContainer");
});

function doSearch() {
  const search = document.getElementById("searchInput").value.trim();
  const semester = document.getElementById("semFilter").value;
  const type = document.getElementById("typeFilter").value;
  Resources.loadResources("resourcesContainer", { search, semester, type });
}
</script>
</body>
</html>
