<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Academics | Faculty Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="dashboard-body">

<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">F</div>
    <a href="/faculty/">🏠 Dashboard</a>
    <a href="/faculty/students">👨‍🎓 Students</a>
    <a href="/faculty/academics">📚 Academics</a>
    <a href="/faculty/attendance">✅ Attendance</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">

    <section class="greeting">
      <h1>📚 Academics Management</h1>
      <p>Add assignments, schedule exams and view submissions</p>
    </section>

    <!-- ASSIGNMENTS SECTION -->
    <section class="main-grid">

      <div class="card">
        <h2>📝 Add New Assignment</h2>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">

          <label style="color:var(--muted); font-size:13px;">Title *</label>
          <input id="aTitle" placeholder="e.g. Unit 3 Assignment"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">

          <label style="color:var(--muted); font-size:13px;">Subject</label>
          <input id="aSubject" placeholder="e.g. Data Structures"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">

          <!-- ✅ NEW: Course dropdown — only shows faculty's own courses -->
          <label style="color:var(--muted); font-size:13px;">Linked Course (optional)</label>
          <select id="aCourse"
            style="padding:12px; border-radius:10px; border:1px solid var(--border); font-size:14px;">
            <option value="">— Select a course (optional) —</option>
          </select>
          <p id="aCourseNote" style="font-size:12px; color:var(--muted); margin-top:-6px;">
            📋 Loading your courses...
          </p>

          <label style="color:var(--muted); font-size:13px;">Description (optional)</label>
          <textarea id="aDesc" placeholder="Optional details..." rows="3"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);
              font-family:inherit; resize:vertical;"></textarea>

          <label style="color:var(--muted); font-size:13px;">Due Date *</label>
          <input type="date" id="aDueDate"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">

          <button onclick="addAssignment()"
            style="padding:12px; border-radius:10px; border:none;
              background:linear-gradient(135deg,var(--primary),var(--secondary));
              color:white; font-weight:700; cursor:pointer; font-family:inherit;">
            ➕ Add Assignment
          </button>
          <p id="aMsg" style="font-weight:600; min-height:20px;"></p>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2>📋 My Assignments</h2>
          <span id="assignCountBadge"
            style="background:#eef2ff; color:#4f46e5; font-size:12px;
              font-weight:700; padding:3px 10px; border-radius:20px;">0</span>
        </div>
        <div id="assignmentList"
          style="display:flex; flex-direction:column; gap:10px;
            max-height:450px; overflow-y:auto;">
          <p style="color:var(--muted);">Loading...</p>
        </div>
      </div>

    </section>

    <!-- EXAMS SECTION -->
    <section class="main-grid">

      <div class="card">
        <h2>🧪 Schedule Exam</h2>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">

          <label style="color:var(--muted); font-size:13px;">Subject *</label>
          <input id="eSubject" placeholder="e.g. Operating Systems"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">

          <!-- ✅ NEW: Course dropdown for exams too -->
          <label style="color:var(--muted); font-size:13px;">Linked Course (optional)</label>
          <select id="eCourse"
            style="padding:12px; border-radius:10px; border:1px solid var(--border); font-size:14px;">
            <option value="">— Select a course (optional) —</option>
          </select>

          <label style="color:var(--muted); font-size:13px;">Exam Date *</label>
          <input type="date" id="eDate"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">

          <label style="color:var(--muted); font-size:13px;">Exam Type</label>
          <select id="eType"
            style="padding:12px; border-radius:10px; border:1px solid var(--border);">
            <option value="Regular">Regular</option>
            <option value="Mid-Term">Mid-Term</option>
            <option value="End-Term">End-Term</option>
            <option value="Practical">Practical</option>
            <option value="Viva">Viva</option>
          </select>

          <button onclick="addExam()"
            style="padding:12px; border-radius:10px; border:none;
              background:linear-gradient(135deg,var(--primary),var(--secondary));
              color:white; font-weight:700; cursor:pointer; font-family:inherit;">
            ➕ Schedule Exam
          </button>
          <p id="eMsg" style="font-weight:600; min-height:20px;"></p>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2>🗓️ Scheduled Exams</h2>
          <span id="examCountBadge"
            style="background:#fef3c7; color:#92400e; font-size:12px;
              font-weight:700; padding:3px 10px; border-radius:20px;">0</span>
        </div>
        <div id="examList"
          style="display:flex; flex-direction:column; gap:10px;
            max-height:400px; overflow-y:auto;">
          <p style="color:var(--muted);">Loading...</p>
        </div>
      </div>

    </section>

  </main>
</div>

<script src="/dashboards/faculty/js/faculty-academics.js"></script>
</body>
</html>
