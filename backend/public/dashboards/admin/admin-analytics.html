<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics | Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">A</div><span class="brand-name">Admin Panel</span></div>
    <nav class="nav">
      <a href="/admin"           class="nav-link">⬛ Dashboard</a>
      <a href="/admin/users"     class="nav-link">👥 Users</a>
      <a href="/admin/events"    class="nav-link">🎉 Events</a>
      <a href="/admin/analytics" class="nav-link active">📊 Analytics</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><p class="topbar-label">Admin</p><h1 class="topbar-name">System Analytics</h1></div>
    </header>

    <div style="padding:24px 36px 0;display:flex;flex-direction:column;gap:20px;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-title">👥 User Role Distribution</div>
          <div id="roleDist" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;">
            <p style="color:var(--muted);">Loading...</p>
          </div>
        </div>
        <div class="card">
          <div class="card-title">🎉 Events by Category</div>
          <div id="eventCat" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;">
            <p style="color:var(--muted);">Loading...</p>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-title">🏆 Top Events by Registrations</div>
          <div id="topEvents" style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">
            <p style="color:var(--muted);">Loading...</p>
          </div>
        </div>
        <div class="card">
          <div class="card-title">📅 Monthly New Users (Last 6 Months)</div>
          <div id="monthlyUsers" style="display:flex;flex-direction:column;gap:8px;margin-top:4px;">
            <p style="color:var(--muted);">Loading...</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🕐 Full Activity Log</div>
        <div id="activityFull" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;">
          <p style="color:var(--muted);">Loading...</p>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="/dashboards/admin/js/admin-analytics.js"></script>
</body>
</html>
