<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users | Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">A</div><span class="brand-name">Admin Panel</span></div>
    <nav class="nav">
      <a href="/admin"           class="nav-link">⬛ Dashboard</a>
      <a href="/admin/users"     class="nav-link active">👥 Users</a>
      <a href="/admin/events"    class="nav-link">🎉 Events</a>
      <a href="/admin/analytics" class="nav-link">📊 Analytics</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><p class="topbar-label">Admin</p><h1 class="topbar-name">User Management</h1></div>
    </header>

    <div style="padding:24px 36px 0;display:flex;flex-direction:column;gap:16px;">

      <!-- FILTERS -->
      <div class="filter-bar">
        <input id="searchUser" class="filter-input" placeholder="🔍 Search by name, email, PRN, class..." oninput="filterUsers()">
        <select id="roleFilter" class="filter-input" onchange="filterUsers()" style="flex:0 0 180px;">
          <option value="">All Roles</option>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
          <option value="alumni">Alumni</option>
          <option value="club_head">Club Head</option>
          <option value="admin">Admin</option>
        </select>
        <select id="statusFilter" class="filter-input" onchange="filterUsers()" style="flex:0 0 150px;">
          <option value="">All Status</option>
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
        <span id="userCountLabel" style="color:var(--muted);font-size:14px;align-self:center;white-space:nowrap;"></span>
      </div>

      <div id="statusMessage" style="min-height:20px;font-weight:600;text-align:center;font-size:14px;"></div>

      <!-- TABLE -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-container">
          <table class="users-table">
            <thead>
              <tr>
                <th>ID</th><th>User Info</th><th>Role</th>
                <th>Club</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="6" style="padding:40px;text-align:center;color:var(--muted);">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- CLUB MODAL -->
<div id="clubModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">🏫 Assign Club</div>
    <p style="color:var(--muted);margin-bottom:16px;font-size:14px;">User: <strong id="modalUsername"></strong></p>
    <select id="clubSelect" class="filter-input" style="width:100%;margin-bottom:14px;"></select>
    <select id="positionSelect" class="filter-input" style="width:100%;margin-bottom:20px;"></select>
    <div style="display:flex;gap:10px;">
      <button class="action-btn btn-primary" onclick="saveClubAssignment()" style="flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;">Save</button>
      <button class="action-btn btn-secondary" onclick="closeClubModal()" style="flex:1;padding:10px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;">Cancel</button>
    </div>
  </div>
</div>

<script src="/dashboards/admin/js/admin-users.js"></script>
</body>
</html>
