<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">A</div>
      <span class="brand-name">Admin Panel</span>
    </div>
    <nav class="nav">
      <a href="/admin"           class="nav-link active">⬛ Dashboard</a>
      <a href="/admin/users"     class="nav-link">👥 Users</a>
      <a href="/admin/events"    class="nav-link">🎉 Events</a>
      <a href="/admin/analytics" class="nav-link">📊 Analytics</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="topbar-label">Admin</p>
        <h1 class="topbar-name">Control Panel</h1>
      </div>
      <div class="avatar">A</div>
    </header>

    <!-- STATS -->
    <section class="stats-row">
      <div class="stat-card accent-indigo"><div class="stat-label">👥 Users</div>      <div class="stat-val" id="totalUsers">0</div></div>
      <div class="stat-card accent-violet"><div class="stat-label">🎉 Events</div>     <div class="stat-val" id="totalEvents">0</div></div>
      <div class="stat-card accent-sky">   <div class="stat-label">📚 Resources</div> <div class="stat-val" id="totalResources">0</div></div>
      <div class="stat-card accent-teal">  <div class="stat-label">🏫 Clubs</div>     <div class="stat-val" id="totalClubs">0</div></div>
    </section>

    <div style="padding:24px 36px 0; display:flex; flex-direction:column; gap:20px;">

      <!-- QUICK ACTIONS -->
      <div class="card">
        <div class="card-title">⚡ Quick Actions</div>
        <div class="action-grid">
          <div class="action" onclick="location.href='/admin/users'">👥 Manage Users</div>
          <div class="action" onclick="location.href='/admin/events'">🎉 Manage Events</div>
          <div class="action" onclick="showPanel('noticePanel')">📢 Post Notice</div>
          <div class="action" onclick="showPanel('clubPanel')">🏫 Add Club</div>
        </div>
      </div>

      <!-- POST NOTICE -->
      <div class="card" id="noticePanel" style="display:none;">
        <div class="card-title">📢 Post Global Notice</div>
        <div style="display:flex;flex-direction:column;gap:12px;max-width:500px;">
          <textarea id="noticeText" placeholder="Notice content..." rows="3"
            style="padding:12px;border-radius:10px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;resize:vertical;"></textarea>
          <button onclick="postNotice()"
            style="padding:12px;border-radius:10px;border:none;background:var(--indigo);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;">
            Post Notice
          </button>
          <p id="noticeMsg" style="font-weight:600;font-size:14px;"></p>
        </div>
      </div>

      <!-- ADD CLUB -->
      <div class="card" id="clubPanel" style="display:none;">
        <div class="card-title">🏫 Add New Club</div>
        <div style="display:flex;flex-direction:column;gap:12px;max-width:500px;">
          <input id="clubName" placeholder="Club Name"
            style="padding:12px;border-radius:10px;border:1px solid var(--border);font-size:14px;">
          <input id="clubCategory" placeholder="Category (e.g. Technical, Cultural)"
            style="padding:12px;border-radius:10px;border:1px solid var(--border);font-size:14px;">
          <textarea id="clubDesc" placeholder="Description" rows="2"
            style="padding:12px;border-radius:10px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;"></textarea>
          <button onclick="addClub()"
            style="padding:12px;border-radius:10px;border:none;background:var(--indigo);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;">
            Add Club
          </button>
          <p id="clubMsg" style="font-weight:600;font-size:14px;"></p>
        </div>
      </div>

      <!-- RECENT USERS + ACTIVITY -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-title">🆕 Recent Users</div>
          <div id="recentUsers" style="display:flex;flex-direction:column;gap:8px;"></div>
        </div>
        <div class="card">
          <div class="card-title">🕐 Recent Activity</div>
          <div id="activityLog" style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;"></div>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="/dashboards/admin/js/admin-dashboard.js"></script>
</body>
</html>
