<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Events | Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">A</div>
    <a href="/admin">🏠 Dashboard</a>
    <a href="/admin/users">👥 Users</a>
    <a href="/admin/events">🎉 Events</a>
    <a href="/admin/analytics">📊 Analytics</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">

    <section class="greeting">
      <h1>🎉 Event Management</h1>
      <p>Create, view and manage all campus events</p>
    </section>

    <section class="main-grid">

      <!-- ── CREATE FORM ── -->
      <div class="card">
        <h2>➕ Create New Event</h2>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">

          <label style="font-size:13px;color:#6b7280;">
            Event Title <span style="color:red;">*</span>
          </label>
          <input id="eTitle" placeholder="e.g. Annual Sports Day"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <label style="font-size:13px;color:#6b7280;">Description</label>
          <textarea id="eDesc" placeholder="Brief description…" rows="3"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;
              font-family:inherit;resize:vertical;font-size:14px;"></textarea>

          <label style="font-size:13px;color:#6b7280;">Category</label>
          <select id="eCategory"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">
            <option value="Academic">🎓 Academic</option>
            <option value="Cultural">🎉 Cultural</option>
            <option value="Sports">⚽ Sports</option>
            <option value="Technical">💻 Technical</option>
            <option value="General">📋 General</option>
          </select>

          <label style="font-size:13px;color:#6b7280;">
            Event Date <span style="color:red;">*</span>
          </label>
          <input type="date" id="eDate"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <label style="font-size:13px;color:#6b7280;">Event Time</label>
          <input type="time" id="eTime"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <label style="font-size:13px;color:#6b7280;">Venue</label>
          <input id="eVenue" placeholder="e.g. Main Auditorium"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <label style="font-size:13px;color:#6b7280;">Organizer</label>
          <input id="eOrganizer" placeholder="e.g. MIT College"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <label style="font-size:13px;color:#6b7280;">Seats Available</label>
          <input type="number" id="eSeats" placeholder="e.g. 100" min="1"
            style="padding:12px;border-radius:10px;border:1px solid #e0e7ff;font-size:14px;">

          <!-- ✅ onclick calls submitEvent — NOT createEvent (reserved browser name) -->
          <button onclick="submitEvent()"
            style="padding:14px;border-radius:10px;border:none;
              background:linear-gradient(135deg,#6366f1,#8b5cf6);
              color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;">
            Create Event
          </button>

          <p id="eventMsg"
            style="font-weight:600;text-align:center;min-height:24px;font-size:14px;"></p>
        </div>
      </div>

      <!-- ── EVENT LIST ── -->
      <div class="card">
        <h2>📋 All Events</h2>
        <div id="eventList"
          style="display:flex;flex-direction:column;gap:8px;margin-top:14px;
            max-height:620px;overflow-y:auto;">
          <p style="color:#6b7280;font-size:14px;">Loading events…</p>
        </div>
      </div>

    </section>

    <!-- ── REGISTRATIONS PANEL ── -->
    <section class="card" id="regPanel"
      style="display:none;flex:none;width:100%;margin-top:10px;">
      <h2>
        👥 Registrations —
        <span id="regTitle" style="color:#6366f1;"></span>
      </h2>
      <button onclick="document.getElementById('regPanel').style.display='none'"
        style="margin-bottom:14px;padding:7px 14px;border-radius:8px;
          border:1px solid #e0e7ff;cursor:pointer;background:white;font-size:13px;">
        ← Back to Events
      </button>
      <p id="regCount"
        style="color:#6b7280;font-size:13px;margin-bottom:12px;"></p>
      <div id="regList"
        style="display:flex;flex-wrap:wrap;gap:10px;"></div>
    </section>

  </main>
</div>

<script src="/dashboards/admin/js/admin-events.js"></script>
</body>
</html>
