<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alumni Directory | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">
  <aside class="sidebar">
    <div class="logo-icon">AL</div>
    <a href="/alumni/dashboard">🏠 Dashboard</a>
    <a href="/alumni/profile-page">👤 My Profile</a>
    <a href="/common/events/events.html">🎉 Events</a>
    <a href="/alumni/directory-page">📋 Directory</a>

    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">
    <section class="greeting">
      <h1>🎓 Alumni Directory</h1>
      <p>Connect with fellow graduates</p>
    </section>

    <section class="card" style="flex:none; width:100%; padding:20px;">
      <input id="searchInput" placeholder="🔍 Search by name, company or degree..." oninput="filterAlumni()"
        style="padding:10px 14px; border-radius:10px; border:1px solid var(--border); width:100%; max-width:400px;">
    </section>

    <section id="alumniGrid" class="snapshot" style="flex-wrap:wrap;"></section>
  </main>
</div>

<script src="/dashboards/alumni/js/alumni-directory.js"></script>
</body>
</html>
