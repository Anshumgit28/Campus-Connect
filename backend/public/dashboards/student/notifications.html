<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Student Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">S</div>
    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/dashboards/student/profile.html">👤 Profile</a>
    <a href="/dashboards/student/academics.html">📊 Academics</a>
    <a href="/dashboards/student/notifications.html">🔔 Notifications</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">
    <section class="greeting">
      <h1>🔔 Notifications</h1>
      <p>Stay updated with important announcements</p>
    </section>

    <section class="card" style="width:100%; flex:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>All Notifications</h2>
        <button onclick="NotificationsPage.markAllRead()"
          style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:white; cursor:pointer; font-weight:600;">
          Mark All Read
        </button>
      </div>
      <div id="notificationsList"></div>
    </section>
  </main>
</div>

<script src="/js/modules/api.js"></script>
<script src="/common/notifications/notifications.js"></script>
<script src="/dashboards/student/js/notifications.js"></script>
</body>
</html>
