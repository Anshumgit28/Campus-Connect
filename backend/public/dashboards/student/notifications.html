<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Student Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/dashboards/student/css/notification.css">

</head>
<body class="dashboard-body">
<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">S</div>
    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/dashboards/student/profile.html">👤 Profile</a>
    <a href="/dashboards/student/academics.html">📊 Academics</a>
    <a href="/dashboards/student/notifications.html">🔔 Notifications</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">
    <section class="greeting">
      <h1>🔔 Notifications</h1>
      <p>Stay updated with announcements and invitations</p>
    </section>

    <!-- ── CLUB INVITATIONS SECTION ── -->
    <section class="card" style="width:100%; flex:none;" id="invitationsSection">
      <div class="section-header">
        <div>
          <div class="section-title">
            📨 Club Invitations
            <span id="inviteBadge" style="background:#f59e0b;color:white;font-size:11px;
              padding:2px 9px;border-radius:20px;margin-left:8px;display:none;">0</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px;">
            Accept or decline invitations from club heads
          </div>
        </div>
        <a href="/club/invitations" class="btn btn-outline btn-sm" style="padding:7px 14px;border-radius:9px;border:1px solid var(--border);font-size:13px;font-weight:600;text-decoration:none;color:var(--text);">
          View All →
        </a>
      </div>
      <div id="invitationsList">
        <p style="color:var(--muted);">Loading invitations...</p>
      </div>
    </section>

    <!-- ── ALL NOTIFICATIONS ── -->
    <section class="card" style="width:100%; flex:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>All Notifications</h2>
        <button onclick="markAllRead()"
          style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:white; cursor:pointer; font-weight:600;">
          Mark All Read
        </button>
      </div>
      <div id="notificationsList"></div>
    </section>
  </main>
</div>



<script src="/dashboards/student/js/notifications-page"></script>
</body>
</html>
