<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Student Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">S</div>
    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/dashboards/student/profile.html">👤 Profile</a>
    <a href="/dashboards/student/academics.html">📊 Academics</a>
    <a href="/dashboards/student/notifications.html">🔔 Notifications</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard" style="max-width:600px; margin:60px auto;">
    <section class="greeting">
      <h1>👤 Edit Profile</h1>
      <p>Update your personal information</p>
    </section>

    <div class="card">
      <h2 style="margin-bottom:20px;">Profile Information</h2>
      
      <label style="color:var(--muted); font-size:13px; display:block; margin-bottom:6px;">Full Name</label>
      <input id="username" placeholder="Full Name" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:16px;">
      
      <label style="color:var(--muted); font-size:13px; display:block; margin-bottom:6px;">PRN</label>
      <input id="prn" placeholder="PRN Number" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:16px;">
      
      <label style="color:var(--muted); font-size:13px; display:block; margin-bottom:6px;">Class</label>
      <input id="class_name" placeholder="e.g., TE IT" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:16px;">
      
      <label style="color:var(--muted); font-size:13px; display:block; margin-bottom:6px;">Division</label>
      <input id="division" placeholder="e.g., A" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:16px;">
      
      <label style="color:var(--muted); font-size:13px; display:block; margin-bottom:6px;">Current Year</label>
      <select id="current_year" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:24px;">
        <option value="">Select Year</option>
        <option value="FE">First Year (FE)</option>
        <option value="SE">Second Year (SE)</option>
        <option value="TE">Third Year (TE)</option>
        <option value="BE">Final Year (BE)</option>
      </select>
      
      <button id="saveBtn">💾 Save Changes</button>
      <p id="saveMsg" style="margin-top:12px; font-weight:600; text-align:center;"></p>
    </div>
  </main>
</div>

<script src="/js/modules/api.js"></script>
<script src="/dashboards/student/js/profile-page.js"></script>
</body>
</html>
