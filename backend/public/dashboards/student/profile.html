<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
<div class="layout">
  <aside class="sidebar">
    <div class="logo-icon">S</div>
    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/dashboards/student/profile.html">👤 Profile</a>
    <a href="/common/events/events.html">🎉 Events</a>
    <a href="/common/resources/resources.html">📚 Resources</a>
    <a href="/dashboards/student/academics.html">📊 Academics</a>
    <a href="/dashboards/student/notifications.html">🔔 Notifications</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">
    <section class="greeting">
      <h1>👤 My Profile</h1>
      <p>Keep your profile information updated</p>
    </section>

    <div class="card" style="max-width:520px; flex:none; width:100%;">
      <h2 style="margin-bottom:20px;">Edit Profile</h2>
      
      <label style="color:var(--muted); font-size:13px;">Full Name *</label>
      <input id="username" placeholder="Full Name" required
        style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:14px;">
      
      <label style="color:var(--muted); font-size:13px;">PRN</label>
      <input id="prn" placeholder="PRN Number" 
        style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:14px;">
      
      <label style="color:var(--muted); font-size:13px;">Class</label>
      <input id="class_name" placeholder="e.g. TY-IT-A" 
        style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:14px;">
      
      <label style="color:var(--muted); font-size:13px;">Division</label>
      <input id="division" placeholder="e.g. A" 
        style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:14px;">
      
      <label style="color:var(--muted); font-size:13px;">Current Year</label>
      <select id="current_year" 
        style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:20px;">
        <option value="">Select Year</option>
        <option value="FY">FY</option>
        <option value="SY">SY</option>
        <option value="TY">TY</option>
        <option value="Final Year">Final Year</option>
      </select>
      
      <button id="saveBtn" 
        style="width:100%; padding:14px; border-radius:10px; border:none; 
          background:linear-gradient(135deg,var(--primary),var(--secondary)); 
          color:white; font-weight:700; font-size:15px; cursor:pointer;">
        💾 Save Profile
      </button>
      
      <p id="saveMsg" style="margin-top:10px; font-weight:600; text-align:center; min-height:20px;"></p>
    </div>
  </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // Load profile data
  fetch("/dashboard/data", { credentials: "include" })
    .then(r => r.json())
    .then(data => {
      document.getElementById("username").value = data.user || "";
      document.getElementById("prn").value = 
        (data.prn && data.prn !== "Not Added") ? data.prn : "";
      document.getElementById("class_name").value = 
        (data.class_name && data.class_name !== "Not Added") ? data.class_name : "";
      document.getElementById("division").value = 
        (data.division && data.division !== "Not Added") ? data.division : "";
      document.getElementById("current_year").value = 
        (data.current_year && data.current_year !== "Not Added") ? data.current_year : "";
    })
    .catch(err => {
      console.error("Profile load error:", err);
      showMessage("Failed to load profile", true);
    });

  // Save profile
  document.getElementById("saveBtn").addEventListener("click", async () => {
    const username = document.getElementById("username").value.trim();
    const msg = document.getElementById("saveMsg");
    const btn = document.getElementById("saveBtn");
    
    if (!username) {
      showMessage("Name is required", true);
      return;
    }
    
    // Disable button during save
    btn.disabled = true;
    btn.style.opacity = "0.6";
    btn.innerText = "Saving...";
    
    const body = {
      username: username,
      prn: document.getElementById("prn").value.trim(),
      class_name: document.getElementById("class_name").value.trim(),
      division: document.getElementById("division").value.trim(),
      current_year: document.getElementById("current_year").value
    };
    
    try {
      const res = await fetch("/dashboard/profile/update", {
        method: "POST", 
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      
      const d = await res.json();
      
      if (d.success) {
        showMessage("✅ Profile updated successfully!", false);
        setTimeout(() => {
          window.location = "/dashboard";
        }, 1500);
      } else {
        showMessage("❌ " + (d.message || "Failed to save"), true);
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.innerText = "💾 Save Profile";
      }
    } catch (err) {
      console.error("Profile save error:", err);
      showMessage("❌ Network error", true);
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.innerText = "💾 Save Profile";
    }
  });
});

function showMessage(msg, isError) {
  const el = document.getElementById("saveMsg");
  el.style.color = isError ? "red" : "green";
  el.innerText = msg;
  if (!isError) {
    setTimeout(() => { el.innerText = ""; }, 3000);
  }
}
</script>
</body>
</html>
