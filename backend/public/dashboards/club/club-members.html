<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Members | Campus Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="dashboard-body">

<div class="layout">

  <aside class="sidebar">
    <div class="logo-icon">C</div>
    <a href="/club/">🏠 Dashboard</a>
    <a href="/club/members">👥 Members</a>
    <a href="/club/events">🎉 Events</a>
    <a href="/club/announcements">📢 Announcements</a>
    <a href="/logout">🚪 Logout</a>
  </aside>

  <main class="dashboard">

    <section class="greeting">
      <h1>👥 Club Members</h1>
      <p>Approve requests and manage your club members</p>
    </section>

    <!-- PENDING REQUESTS -->
    <section class="card" style="width:100%; flex:none;">
      <h2>⏳ Pending Join Requests <span id="pendingBadge" style="background:#f59e0b; color:white; font-size:13px; padding:2px 10px; border-radius:20px; margin-left:8px;">0</span></h2>
      <div id="requestsList" style="display:flex; flex-direction:column; gap:12px; margin-top:16px;"></div>
    </section>

    <!-- APPROVED MEMBERS -->
    <section class="card" style="width:100%; flex:none;">
      <h2>✅ Approved Members <span id="memberBadge" style="background:#22c55e; color:white; font-size:13px; padding:2px 10px; border-radius:20px; margin-left:8px;">0</span></h2>
      <div id="membersList" style="display:flex; flex-direction:column; gap:12px; margin-top:16px;"></div>
    </section>

  </main>
</div>

<script src="/dashboards/club/js/club-members.js"></script>
</body>
</html>
