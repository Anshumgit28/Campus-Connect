<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Club</title>
  <link rel="stylesheet" href="/dashboards/club/css/club-features.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">C</div>
      <span class="brand-name">Campus Connect</span>
    </div>
    <nav class="nav">
      <a href="/club/"               class="nav-link">⬛ Dashboard</a>
      <a href="/club/members"        class="nav-link">👥 Members</a>
      <a href="/club/events"         class="nav-link">🎉 Events</a>
      <a href="/club/announcements"  class="nav-link">📢 Announcements</a>
      <a href="/club/attendance"     class="nav-link">✅ Attendance</a>
      <a href="/club/treasury"       class="nav-link">💰 Treasury</a>
      <a href="/club/tasks"          class="nav-link">📋 Tasks</a>
      <a href="/club/polls"          class="nav-link">🗳️ Polls</a>
      <a href="/club/gallery"        class="nav-link active">🖼️ Gallery</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="topbar-label">Club Management</p>
        <h1 class="topbar-name">Club Gallery</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openUploadModal()">📤 Upload Photo</button>
        <div class="avatar" id="avatarLetter">C</div>
      </div>
    </header>

    <div class="content">

      <!-- STATS & FILTER -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:14px;color:var(--muted);" id="galleryCount">Loading...</span>
          <select id="filterEvent" onchange="filterGallery()" style="font-size:13px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--border);">
            <option value="">All Events</option>
          </select>
        </div>
        <input id="gallerySearch" placeholder="🔍 Search photos..."
          oninput="filterGallery()"
          style="font-size:13px;padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);width:220px;">
      </div>

      <!-- GALLERY GRID -->
      <div class="gallery-grid" id="galleryGrid">
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);">
          <div style="font-size:40px;margin-bottom:12px;opacity:.4;">🖼️</div>
          <p>Loading gallery...</p>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📤 Upload Photo</div>
      <button class="modal-close" onclick="closeModal('uploadModal')">✕</button>
    </div>

    <div class="field-group">
      <label>Title *</label>
      <input id="photoTitle" placeholder="e.g. Annual Day Celebration">
    </div>
    <div class="field-group">
      <label>Event Name</label>
      <input id="photoEvent" placeholder="e.g. Techfest 2025">
    </div>
    <div class="field-group">
      <label>Description (optional)</label>
      <textarea id="photoDesc" placeholder="Caption or notes about this photo..."></textarea>
    </div>
    <div class="field-group">
      <label>Photo * (JPG, PNG, GIF — max 10MB)</label>
      <input type="file" id="photoFile" accept="image/jpeg,image/png,image/gif,image/webp">
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">Supported formats: JPG, PNG, GIF, WebP</div>
    </div>

    <!-- Preview -->
    <div id="photoPreviewWrap" style="display:none;margin-bottom:14px;">
      <img id="photoPreview" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;border:1.5px solid var(--border);">
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary btn-full" onclick="uploadPhoto()">📤 Upload</button>
      <button class="btn btn-outline" onclick="closeModal('uploadModal')">Cancel</button>
    </div>
    <div id="uploadMsg" class="msg"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" class="lightbox-img" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
  <div style="position:absolute;bottom:20px;right:20px;">
    <button id="lightboxDelete" class="btn btn-danger btn-sm" onclick="event.stopPropagation();">🗑 Delete</button>
  </div>
</div>

<script src="/dashboards/club/js/club-gallery.js"></script>
</body>
</html>
