<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Announcements | Campus Connect</title>
  <link rel="stylesheet" href="/dashboards/club/css/club-features.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">C</div>
      <span class="brand-name">Campus Connect</span>
    </div>
    <nav class="nav">
      <a href="/club/"               class="nav-link">⬛ Dashboard</a>
      <a href="/club/members"        class="nav-link">👥 Members</a>
      <a href="/club/events"         class="nav-link">🎉 Events</a>
      <a href="/club/announcements"  class="nav-link active">📢 Announcements</a>
      <a href="/club/attendance"     class="nav-link">✅ Attendance</a>
      <a href="/club/treasury"       class="nav-link">💰 Treasury</a>
      <a href="/club/tasks"          class="nav-link">📋 Tasks</a>
      <a href="/club/polls"          class="nav-link">🗳️ Polls</a>
      <a href="/club/gallery"        class="nav-link">🖼️ Gallery</a>
    </nav>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="topbar-label">Club Management</p>
        <h1 class="topbar-name">Announcements</h1>
      </div>
      <div class="topbar-right">
        <!-- Post button — only shown to President/VP -->
        <button class="btn btn-primary" id="postBtn" style="display:none;"
          onclick="togglePostForm()">➕ New Announcement</button>
        <div class="avatar" id="avatarLetter">C</div>
      </div>
    </header>

    <div class="content">

      <!-- POST FORM (President/VP only, single form) -->
      <div class="card" id="postForm" style="display:none;">
        <div class="card-header">
          <div class="card-title">📢 New Announcement</div>
          <button class="btn btn-outline btn-sm" onclick="togglePostForm()">✕ Close</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">
          This announcement will be visible to all club members.
        </p>
        <textarea id="announceText" placeholder="Write your announcement here..." rows="5"
          style="width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border);
            font-family:'DM Sans',sans-serif;font-size:15px;resize:vertical;transition:.2s;"
          onfocus="this.style.borderColor='var(--primary)';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)';"
          onblur="this.style.borderColor='var(--border)';this.style.boxShadow='';"></textarea>
        <div style="display:flex;align-items:center;gap:12px;margin-top:14px;">
          <button class="btn btn-primary" onclick="postAnnouncement()">📢 Post Announcement</button>
          <span id="announceMsg" style="font-size:13px;font-weight:600;"></span>
        </div>
      </div>

      <!-- ANNOUNCEMENTS LIST -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 All Announcements</div>
          <span id="countBadge" style="font-size:13px;color:var(--muted);"></span>
        </div>
        <div id="announceList" style="display:flex;flex-direction:column;gap:14px;margin-top:16px;max-height:600px;overflow-y:auto;">
          <div class="empty-state"><span class="empty-icon">📢</span><p>Loading announcements...</p></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/dashboards/club/js/club-announcements.js"></script>
</body>
</html>
